<nz-layout class="app-layout">
  @if (!isCustomerLoggedIn && !isAdminLoggedIn) {
    <nz-sider nzCollapsible nzWidth="200px">
    <ul nz-menu nzTheme="dark" nzMode="inline">
      <li nz-menu-item routerLink="/register" routerLinkActive="ant-menu-item-selected" [routerLinkActiveOptions]="{ exact: true }">
        <span nz-icon nzType="user"></span>
        <span><strong>Register</strong></span>
      </li>
      <li nz-menu-item routerLink="/login" routerLinkActive="ant-menu-item-selected" [routerLinkActiveOptions]="{ exact: true }">
        <span nz-icon nzType="login"></span>
        <span><strong>Login</strong></span>
      </li>
    </ul>
    </nz-sider>
  }

  @if (isAdminLoggedIn) {
    <nz-sider nzCollapsible nzWidth="200px">
    <div class="logo">
      <img src="images/hotel-logged.jpg" alt="Hotel photo" class="sider-logo" />
    </div>
    <ul nz-menu nzTheme="dark" nzMode="inline">
      <li nz-menu-item routerLink="/admin/room" routerLinkActive="ant-menu-item-selected" [routerLinkActiveOptions]="{ exact: true }">
        <span nz-icon nzType="apartment"></span>
        <span><strong>Post Room</strong></span>
      </li>
      <li nz-menu-item routerLink="/admin/dashboard" routerLinkActive="ant-menu-item-selected" [routerLinkActiveOptions]="{ exact: true }">
        <span nz-icon nzType="apartment"></span>
        <span><strong>Rooms</strong></span>
      </li>
      <li nz-menu-item routerLink="/admin/reservations" routerLinkActive="ant-menu-item-selected" [routerLinkActiveOptions]="{ exact: true }">
        <span nz-icon nzType="pull-request"></span>
        <span><strong>Reservations</strong></span>
      </li>
      <li nz-menu-item (click)="logout()">
        <span nz-icon nzType="logout"></span>
        <span><strong>Logout</strong></span>
      </li>
    </ul>
    </nz-sider>
  }

  @if (isCustomerLoggedIn) {
    <nz-sider nzCollapsible nzWidth="200px">
    <div class="logo">
      <img src="images/hotel-logged.jpg" alt="Hotel photo" class="sider-logo" />
    </div>
    <ul nz-menu nzTheme="dark" nzMode="inline">
      <li nz-menu-item routerLink="/customer/rooms" routerLinkActive="ant-menu-item-selected" [routerLinkActiveOptions]="{ exact: true }">
        <span nz-icon nzType="apartment"></span>
        <span><strong>Rooms</strong></span>
      </li>
      <li nz-menu-item routerLink="/customer/bookings" routerLinkActive="ant-menu-item-selected" [routerLinkActiveOptions]="{ exact: true }">
        <span nz-icon nzType="pull-request"></span>
        <span><strong>Bookings</strong></span>
      </li>
      <li nz-menu-item (click)="logout()">
        <span nz-icon nzType="logout"></span>
        <span><strong>Logout</strong></span>
      </li>
    </ul>
    </nz-sider>
  }

  <nz-layout class="app-content-layout">
    <nz-content>
      <router-outlet></router-outlet>
    </nz-content>
    <nz-footer></nz-footer>
  </nz-layout>
</nz-layout>
